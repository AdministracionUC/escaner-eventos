<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Acceso a Eventos UC</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --azul: #1E6B3C;
    --azul-oscuro: #123D26;
    --arena: #FDF3D8;
    --verde: #2e7d32;
    --rojo: #c62828;
    --ambar: #b8860b;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: Verdana, Arial, sans-serif;
    background: #eef2f6;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tarjetaApp {
    width: 100%;
    max-width: 460px;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
  }

  header {
    background: var(--azul);
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
    border-bottom: 4px solid #111111;
  }
  header .titulo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  header .titulo span.icono { font-size: 22px; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: 0.3px; }
  header p { margin: 6px 0 0; font-size: 12px; color: var(--arena); }

  #tabs {
    display: flex;
    gap: 8px;
    padding: 14px 16px 0;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    border-radius: 8px;
    background: #fff;
    color: var(--azul);
    border: 2px solid var(--azul);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .tab.activo { background: var(--azul); color: #fff; }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; }

  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid var(--azul);
    background: #000;
  }

  #estadoCamara {
    margin-top: 12px;
    padding: 12px;
    background: #f2f2f2;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    color: #444;
  }

  #panelDni, #panelNombre { display: none; }
  #panelDni input, #panelNombre input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 2px solid var(--azul);
    border-radius: 8px;
    margin-bottom: 10px;
  }
  #panelDni button, #panelNombre button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: var(--azul);
    color: #fff;
    cursor: pointer;
  }

  .tarjeta {
    margin-top: 16px;
    padding: 18px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    border: 1px solid #eee;
  }
  .tarjeta.ok { border-left: 6px solid var(--verde); }
  .tarjeta.error { border-left: 6px solid var(--rojo); }
  .tarjeta.usado { border-left: 6px solid var(--ambar); }

  .tarjeta h2 { margin: 0 0 12px; font-size: 17px; color: var(--azul-oscuro); }
  .fila-dato { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .fila-dato span:first-child { color: #666; }
  .fila-dato span:last-child { font-weight: bold; text-align: right; }

  .indicacion {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--arena);
    border-radius: 8px;
    font-size: 13px;
    color: var(--azul-oscuro);
  }

  .tarjeta button.accion {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: var(--verde);
    color: #fff;
    cursor: pointer;
  }
  .tarjeta button.accion:disabled { background: #999; }

  #reiniciar {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    background: var(--azul-oscuro);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }

  .lista-coincidencias { margin-top: 12px; }
  .item-coincidencia {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .item-coincidencia:hover { border-color: var(--azul); }

  footer {
    background: #111111;
    color: #fff;
    text-align: center;
    padding: 14px 16px;
    font-size: 12px;
  }
  footer .linea1 { font-weight: bold; }
  footer .linea2 { color: #7fbf9b; margin-top: 2px; }
</style>
</head>
<body>

<div class="tarjetaApp">

  <header>
    <div class="titulo">
      <span class="icono">🪪</span>
      <h1>CONTROL DE ACCESO A EVENTOS UC</h1>
    </div>
    <p>Universidad Continental &mdash; Sede Cusco</p>
  </header>

  <div id="tabs">
    <div class="tab activo" id="tabQr">Escanear QR</div>
    <div class="tab" id="tabNombre">Ingreso (Nombre)</div>
    <div class="tab" id="tabDni">Reingreso</div>
  </div>

  <main>
    <div id="panelQr">
      <div id="reader"></div>
      <div id="estadoCamara">📷 Esperando credencial QR...</div>
    </div>

    <div id="panelNombre">
      <input id="inputNombre" type="text" placeholder="Nombre o apellido de la persona">
      <button id="btnBuscarNombre">Buscar</button>
      <div class="estadoIndice" style="font-size:11px;color:#777;margin-top:8px;text-align:center;"></div>
    </div>

    <div id="panelDni">
      <input id="inputDni" type="text" placeholder="DNI o nombre de la persona">
      <button id="btnBuscarDni">Buscar</button>
      <div class="estadoIndice" style="font-size:11px;color:#777;margin-top:8px;text-align:center;"></div>
    </div>

    <div id="resultado"></div>
    <button id="reiniciar">Nueva busqueda</button>
  </main>

  <footer>
    <div class="linea1">Administración de Seguridad</div>
    <div class="linea2">Universidad Continental Cusco</div>
  </footer>

</div>

<script>
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx3D_ijj7w_SUYUXPstrmOUtmA3_lYVkjXvapDdpRQTGmtYTNMkItzI613lSQVQSOAQAA/exec';
  const TIEMPO_TARJETA_MS = 2500; // cuanto tiempo se muestra la tarjeta antes de volver a escanear
  const MAX_REINGRESOS = 2; // debe coincidir con MAX_REINGRESOS del backend (.gs)

  const divResultado = document.getElementById('resultado');
  const botonReiniciar = document.getElementById('reiniciar');
  const panelQr = document.getElementById('panelQr');
  const panelNombre = document.getElementById('panelNombre');
  const panelDni = document.getElementById('panelDni');
  const tabQr = document.getElementById('tabQr');
  const tabNombre = document.getElementById('tabNombre');
  const tabDni = document.getElementById('tabDni');
  const estadoCamara = document.getElementById('estadoCamara');

  let escaneando = true;
  let temporizadorTarjeta = null;
  const scanner = new Html5Qrcode('reader');

  // --- Pestañas ---
  function mostrarPestana(cual) {
    tabQr.classList.toggle('activo', cual === 'qr');
    tabNombre.classList.toggle('activo', cual === 'nombre');
    tabDni.classList.toggle('activo', cual === 'dni');
    panelQr.style.display = cual === 'qr' ? 'block' : 'none';
    panelNombre.style.display = cual === 'nombre' ? 'block' : 'none';
    panelDni.style.display = cual === 'dni' ? 'block' : 'none';
    limpiarResultado();
    if (cual === 'qr') iniciarEscaner(); else { detenerEscanerSiActivo(); cargarIndice(); }
  }

  tabQr.addEventListener('click', function () { mostrarPestana('qr'); });
  tabNombre.addEventListener('click', function () { mostrarPestana('nombre'); });
  tabDni.addEventListener('click', function () { mostrarPestana('dni'); });

  function detenerEscanerSiActivo() {
    if (scanner.getState && scanner.getState() === 2) {
      scanner.stop().catch(function () {});
    }
  }

  function limpiarResultado() {
    if (temporizadorTarjeta) {
      clearTimeout(temporizadorTarjeta);
      temporizadorTarjeta = null;
    }
    divResultado.style.display = 'none';
    divResultado.innerHTML = '';
    botonReiniciar.style.display = 'none';
  }

  function actualizarEstadoCamara(texto) {
    estadoCamara.textContent = texto;
  }

  // --- Modo QR ---
  function iniciarEscaner() {
    escaneando = true;
    actualizarEstadoCamara('📷 Esperando credencial QR...');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      onEscaneoExitoso
    ).catch(function (err) {
      mostrarTarjetaTemporal('error', 'Atencion', '<p>No se pudo acceder a la camara: ' + err + '</p>');
    });
  }

  function onEscaneoExitoso(codigoDecodificado) {
    if (!escaneando) return;
    escaneando = false;
    actualizarEstadoCamara('🔎 Verificando credencial...');
    scanner.stop();
    consultarCodigo(codigoDecodificado);
  }

  // Una sola llamada al backend: el script consulta y, si corresponde,
  // registra el ingreso en la misma pasada (ver accion=escanear en el .gs)
  function consultarCodigo(codigo) {
    fetch(WEBAPP_URL + '?accion=escanear&codigo=' + encodeURIComponent(codigo))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.encontrado) {
          actualizarEstadoCamara('⚠️ Codigo no encontrado');
          mostrarTarjetaTemporal('error', 'Atencion', '<p>Codigo no encontrado. Verifica el QR con el participante.</p>');
          return;
        }
        if (!data.registradoAhora) {
          actualizarEstadoCamara('⚠️ Credencial ya usada');
          mostrarDatosParticipanteTemporal(data, true);
        } else {
          actualizarEstadoCamara('✅ Ingreso registrado');
          mostrarDatosParticipanteTemporal(data, false);
          cargarIndice();
        }
      })
      .catch(function () {
        actualizarEstadoCamara('⚠️ Sin conexion');
        mostrarTarjetaTemporal('error', 'Atencion', '<p>No se pudo conectar con el sistema. Revisa tu conexion.</p>');
      });
  }

  function formatearHora(fechaTexto) {
    const partes = String(fechaTexto).split(' ');
    if (partes.length < 2) return fechaTexto;
    return partes[1].slice(0, 5);
  }

  // Muestra los datos del participante sin botones de accion, y a los pocos
  // segundos cierra la tarjeta sola y vuelve a dejar la camara lista para el
  // siguiente escaneo.
  function mostrarDatosParticipanteTemporal(data, yaIngreso) {
    const contenido =
      '<h2>' + (yaIngreso ? 'Ya registro su ingreso' : 'Ingreso registrado') + '</h2>' +
      filaDato('Nombre', data.nombre) +
      filaDato('DNI', data.dni) +
      filaDato('Evento', data.evento) +
      filaDato('Hora del evento', formatearHora(data.fecha)) +
      filaDato('Lugar / sala', data.lugar) +
      (yaIngreso ? filaDato('Hora de ingreso', data.horaIngreso) : '') +
      '<div class="indicacion">' + (yaIngreso
        ? 'Esta persona ya ingreso antes. Si salio del campus y necesita reingresar, use la pestaña "Reingreso" en vez del QR.'
        : 'Verificación completa del participante y oriente a: <b>' + (data.lugar || 'el lugar indicado') + '</b>.') +
      '</div>';

    mostrarTarjetaTemporal(yaIngreso ? 'usado' : 'ok', null, contenido, true);
  }

  // Tarjeta generica que se auto-cierra despues de TIEMPO_TARJETA_MS y reactiva el escaner.
  // Si contenidoYaTraeTitulo es true, pasar titulo=null.
  function mostrarTarjetaTemporal(tipo, titulo, contenidoHtml, contenidoYaTraeTitulo) {
    divResultado.className = 'tarjeta ' + tipo;
    divResultado.innerHTML = contenidoYaTraeTitulo ? contenidoHtml : ('<h2>' + titulo + '</h2>' + contenidoHtml);
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'none';

    if (temporizadorTarjeta) clearTimeout(temporizadorTarjeta);
    temporizadorTarjeta = setTimeout(function () {
      limpiarResultado();
      if (panelQr.style.display !== 'none') iniciarEscaner();
    }, TIEMPO_TARJETA_MS);
  }

  function filaDato(etiqueta, valor) {
    return '<div class="fila-dato"><span>' + etiqueta + '</span><span>' + (valor || '-') + '</span></div>';
  }

  function mostrarError(mensaje) {
    divResultado.className = 'tarjeta error';
    divResultado.innerHTML = '<h2>Atencion</h2><p>' + mensaje + '</p>';
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'block';
  }

  botonReiniciar.addEventListener('click', function () {
    limpiarResultado();
    if (panelQr.style.display !== 'none') iniciarEscaner();
  });

  // --- Busqueda generica (ingreso por nombre y reingreso) ---
  function buscarPersona(parametros, alSeleccionar, mensajeVacio) {
    fetch(WEBAPP_URL + '?' + parametros)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.mensaje === 'Accion no reconocida') {
          mostrarError('El sistema no reconoce esta funcion todavia. Verifica que el script de CONTROL_INGRESOS este actualizado y que hayas creado una Nueva version en Implementar > Gestionar implementaciones.');
          return;
        }
        if (!data.ok || !data.coincidencias || data.coincidencias.length === 0) {
          mostrarError(data.mensaje || mensajeVacio);
          return;
        }
        if (data.coincidencias.length === 1) {
          alSeleccionar(data.coincidencias[0]);
        } else {
          mostrarListaCoincidencias(data.coincidencias, alSeleccionar);
        }
      })
      .catch(function () {
        mostrarError('No se pudo conectar con el sistema.');
      });
  }

  function mostrarListaCoincidencias(coincidencias, alSeleccionar) {
    alSeleccionar = alSeleccionar || mostrarOpcionReingreso;
    divResultado.className = 'tarjeta';
    let html = '<h2>Se encontraron ' + coincidencias.length + ' registros</h2><div class="lista-coincidencias">';
    coincidencias.forEach(function (c, idx) {
      html += '<div class="item-coincidencia" data-idx="' + idx + '">' +
        '<b>' + c.nombre + '</b><br>' + c.evento + ' - ' + formatearHora(c.fecha) +
        '<br>DNI: ' + (c.dni || 'sin DNI') + (c.estado === 'INGRESO' ? ' - ✅ ya ingreso' : '') + '</div>';
    });
    html += '</div>';
    divResultado.innerHTML = html;
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'block';

    Array.from(document.getElementsByClassName('item-coincidencia')).forEach(function (el, idx) {
      el.addEventListener('click', function () { alSeleccionar(coincidencias[idx]); });
    });
  }

  // --- Lista local de participantes: la busqueda por nombre/DNI es instantanea ---
  let indice = [];
  let indiceListo = false;
  let cargandoIndice = false;
  let recargarAlTerminar = false;

  function normalizar(t) {
    return String(t || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  function pintarEstadoIndice(texto) {
    Array.from(document.getElementsByClassName('estadoIndice')).forEach(function (el) { el.textContent = texto; });
  }

  function cargarIndice() {
    if (cargandoIndice) { recargarAlTerminar = true; return; }
    cargandoIndice = true;
    if (!indiceListo) pintarEstadoIndice('Cargando lista de participantes...');
    fetch(WEBAPP_URL + '?accion=listado')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          indice = data.participantes.map(function (p) { p.busqueda = normalizar(p.nombre); return p; });
          indiceListo = true;
          pintarEstadoIndice('✅ Lista lista: ' + indice.length + ' participantes');
        }
      })
      .catch(function () {
        if (!indiceListo) pintarEstadoIndice('⚠️ No se pudo cargar la lista (se buscara en el servidor, mas lento)');
      })
      .then(function () {
        cargandoIndice = false;
        if (recargarAlTerminar) { recargarAlTerminar = false; cargarIndice(); }
      });
  }

  function buscarLocalPorNombre(texto) {
    const palabras = normalizar(texto).split(/\s+/).filter(Boolean);
    return indice.filter(function (p) {
      return palabras.every(function (w) { return p.busqueda.indexOf(w) !== -1; });
    }).slice(0, 30);
  }

  function buscarLocalPorDni(dni) {
    return indice.filter(function (p) { return String(p.dni).trim() === dni; });
  }

  // Busca en la lista local (instantaneo). Si la lista aun no cargo, usa el servidor.
  function buscarRapido(esDni, texto, alSeleccionar, mensajeVacio) {
    if (!indiceListo) {
      const param = esDni ? 'accion=buscarDni&dni=' : 'accion=buscarNombre&nombre=';
      buscarPersona(param + encodeURIComponent(texto), alSeleccionar, mensajeVacio);
      return;
    }
    const resultados = esDni ? buscarLocalPorDni(texto) : buscarLocalPorNombre(texto);
    if (resultados.length === 0) { mostrarError(mensajeVacio); return; }
    if (resultados.length === 1) alSeleccionar(resultados[0]);
    else mostrarListaCoincidencias(resultados, alSeleccionar);
  }

  function mostrarSinResultados(mensaje) {
    divResultado.className = 'tarjeta';
    divResultado.innerHTML = '<p style="margin:0;color:#666;font-size:13px;">' + mensaje + '</p>';
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'none';
  }

  // Ingreso por nombre: los resultados aparecen mientras se escribe
  document.getElementById('inputNombre').addEventListener('input', function () {
    const texto = this.value.trim();
    if (texto.length < 3) { limpiarResultado(); return; }
    if (!indiceListo) return; // sin lista local se usa el boton Buscar (servidor)
    const resultados = buscarLocalPorNombre(texto);
    if (resultados.length === 0) mostrarSinResultados('Sin coincidencias.');
    else mostrarListaCoincidencias(resultados, mostrarOpcionIngreso);
  });

  document.getElementById('inputNombre').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') document.getElementById('btnBuscarNombre').click();
  });
  document.getElementById('inputDni').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') document.getElementById('btnBuscarDni').click();
  });

  // --- Ingreso por nombre (personas sin QR) ---
  document.getElementById('btnBuscarNombre').addEventListener('click', function () {
    const nombre = document.getElementById('inputNombre').value.trim();
    if (nombre.length < 3) {
      mostrarError('Escribe al menos 3 letras del nombre.');
      return;
    }
    buscarRapido(false, nombre, mostrarOpcionIngreso, 'No se encontro a nadie con ese nombre.');
  });

  function mostrarOpcionIngreso(persona) {
    const yaIngreso = persona.estado === 'INGRESO';
    divResultado.className = 'tarjeta ' + (yaIngreso ? 'usado' : '');

    const bloque = yaIngreso
      ? '<div class="indicacion">Esta persona ya registro su ingreso (' + (persona.horaIngreso || '-') + '). Si salio y vuelve a entrar, use la pestaña "Reingreso".</div>'
      : '<button class="accion" id="btnConfirmarIngreso">Confirmar ingreso</button>';

    divResultado.innerHTML =
      '<h2>Ingreso por nombre</h2>' +
      filaDato('Nombre', persona.nombre) +
      filaDato('DNI', persona.dni) +
      filaDato('Evento', persona.evento) +
      filaDato('Hora del evento', formatearHora(persona.fecha)) +
      filaDato('Lugar / sala', persona.lugar) +
      bloque;
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'block';

    if (!yaIngreso) {
      document.getElementById('btnConfirmarIngreso').addEventListener('click', function () {
        const boton = this;
        boton.disabled = true;
        boton.textContent = 'Registrando...';
        fetch(WEBAPP_URL + '?accion=ingresoManual&hoja=' + encodeURIComponent(persona.hoja) + '&fila=' + persona.fila)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.ok) {
              divResultado.className = 'tarjeta ok';
              divResultado.querySelector('h2').textContent = 'Ingreso registrado';
              persona.estado = 'INGRESO';
              persona.horaIngreso = data.horaIngreso;
              cargarIndice();
              boton.remove();
              divResultado.insertAdjacentHTML('beforeend',
                '<div class="indicacion">Oriente a: <b>' + (persona.lugar || 'el lugar indicado') + '</b>.</div>');
            } else {
              mostrarError(data.mensaje);
            }
          })
          .catch(function () { mostrarError('No se pudo conectar con el sistema.'); });
      });
    }
  }

  // --- Reingreso: por DNI (solo numeros) o por nombre (con letras) ---
  document.getElementById('btnBuscarDni').addEventListener('click', function () {
    const texto = document.getElementById('inputDni').value.trim();
    if (!texto) return;
    if (/^\d+$/.test(texto)) {
      buscarRapido(true, texto, mostrarOpcionReingreso, 'No se encontro a nadie con ese DNI.');
    } else {
      buscarRapido(false, texto, mostrarOpcionReingreso, 'No se encontro a nadie con ese nombre.');
    }
  });

  function mostrarOpcionReingreso(persona) {
    const noIngreso = persona.estado !== 'INGRESO';
    const limiteAlcanzado = Number(persona.reingresos || 0) >= MAX_REINGRESOS;
    divResultado.className = 'tarjeta ' + (noIngreso || limiteAlcanzado ? 'error' : '');

    let bloqueAccion;
    if (noIngreso) {
      bloqueAccion = '<div class="indicacion">Esta persona no tiene un ingreso inicial registrado. Debe escanear su QR o usar la pestaña "Ingreso (Nombre)" primero.</div>';
    } else if (limiteAlcanzado) {
      bloqueAccion = '<div class="indicacion">Esta persona ya alcanzo el limite de ' + MAX_REINGRESOS + ' reingresos permitidos. No se puede registrar otro.</div>';
    } else {
      bloqueAccion = '<button class="accion" id="btnConfirmarReingreso">Confirmar reingreso</button>';
    }

    divResultado.innerHTML =
      '<h2>Reingreso</h2>' +
      filaDato('Nombre', persona.nombre) +
      filaDato('DNI', persona.dni) +
      filaDato('Evento', persona.evento) +
      filaDato('Hora del evento', formatearHora(persona.fecha)) +
      filaDato('Lugar / sala', persona.lugar) +
      filaDato('Reingresos previos', persona.reingresos) +
      bloqueAccion;
    divResultado.style.display = 'block';
    botonReiniciar.style.display = 'block';

    if (!noIngreso && !limiteAlcanzado) {
      document.getElementById('btnConfirmarReingreso').addEventListener('click', function () {
        this.disabled = true;
        this.textContent = 'Registrando...';
        const boton = this;
        fetch(WEBAPP_URL + '?accion=reingreso&hoja=' + encodeURIComponent(persona.hoja) + '&fila=' + persona.fila)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.ok) {
              divResultado.className = 'tarjeta ok';
              divResultado.querySelector('h2').textContent = 'Reingreso registrado';
              persona.reingresos = Number(persona.reingresos || 0) + 1;
              cargarIndice();
              boton.remove();
            } else {
              mostrarError(data.mensaje);
            }
          })
          .catch(function () { mostrarError('No se pudo conectar con el sistema.'); });
      });
    }
  }

  cargarIndice();
  setInterval(cargarIndice, 30000);
  iniciarEscaner();
</script>
</body>
</html>
